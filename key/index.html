<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a5b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>المفتاح</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;color:#fff;min-height:100vh;background:radial-gradient(circle at 50% 0,#1d77c4,#0b2a5b 70%) fixed}
#app{max-width:560px;margin:auto;padding:0 12px 120px}
header{text-align:center;padding:16px 8px;background:#0a0a2a;border-radius:0 0 18px 18px;margin:0 -12px 12px}
h1{margin:0;font-size:26px}
h3{margin:0 0 8px;font-size:17px;border-bottom:1px solid #fff3;padding-bottom:6px}
section{background:#0a0a2a99;border-radius:14px;padding:12px;margin-bottom:12px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;font-weight:500}
input,select{background:#0b0b25;color:#fff;border:1px solid #fff3;border-radius:10px;padding:8px;font-size:16px;min-width:0}
input[type=color]{padding:0;width:44px;height:38px;border:2px solid #fff5}
input[type=range]{flex:1}
input[type=number]{width:80px;text-align:center}
button{font-size:15px;font-weight:800;border:0;border-radius:10px;padding:9px 12px;background:#2b2b55;color:#fff;cursor:pointer;transition:transform .15s,filter .2s}
button:active{transform:scale(.95)}
button.on,.p{background:#b01cff}
.x{background:#f0397a}
.seg{display:flex;gap:8px;align-items:center;margin:8px 0}
.seg button{flex:1}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#0006;padding:8px;border-radius:12px;margin-bottom:8px}
.row input[data-f=v]{flex:1;width:70px}
.row input[data-f=n]{width:52px;padding:8px 2px}
.row select{font-size:20px;padding:5px 2px}
.add{width:100%;background:transparent;border:2px dashed #fff5;color:#fffa}
.keys{flex-wrap:wrap}
.keys button{font-size:24px;padding:6px 10px;flex:none}
footer{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;padding:10px 12px;background:#050518ee;display:grid;gap:8px}
.tot{background:#19f5c8;color:#012;text-align:center;border-radius:10px;padding:8px;font-weight:800}
.go{background:linear-gradient(90deg,#b01cff,#f0397a);padding:14px;font-size:18px;animation:gp 2.2s ease-in-out infinite}
@keyframes gp{50%{box-shadow:0 0 24px #f0397acc}}
.sc{display:flex;justify-content:space-around;gap:6px;background:none;padding:26px 0 10px;margin:0;flex-wrap:wrap}
.tm{text-align:center;padding:6px 14px;border-radius:12px;cursor:pointer;min-width:90px;border:2px solid var(--tc,#fff3)}
.tm b{display:block;font-size:28px}
.tm.act{background:#ffffff26;box-shadow:0 0 0 3px var(--tc),0 0 20px var(--tc);animation:ap 1.6s ease-in-out infinite alternate}
@keyframes ap{to{box-shadow:0 0 0 3px var(--tc),0 0 34px var(--tc)}}
.info{text-align:center;margin:4px 0 10px;font-weight:800;color:#ffe}
.board{display:grid;gap:8px}
.card{aspect-ratio:1;border-radius:var(--rad,14px);border:var(--bw,0px) solid var(--bc,#fff);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--sz)*.34);cursor:pointer;background:var(--f);color:var(--tx,#111);box-shadow:0 4px 0 #0005,0 0 14px #0004;overflow:hidden;position:relative;user-select:none;transition:transform .15s,filter .2s}
.card:not(.open):not(.rev):active{transform:scale(.93)}
.card:not(.open):not(.rev):hover{filter:brightness(1.1)}
.card img{width:70%;height:70%;object-fit:contain}
.card.open,.card.rev{background:var(--b);border:3px solid var(--oc,#a855f7);box-shadow:0 0 14px var(--oc,#a855f7);cursor:default}
.card.rev{opacity:.55}
.card .bk{display:flex;flex-direction:column;align-items:center;line-height:1}
.sw{display:flex;align-items:center;gap:6px}
.sw>:first-child{flex:1;min-width:0}
.sdel{flex:none;font-size:10px;font-weight:600;padding:4px 7px;border-radius:8px;background:#f0397a55;border:1px solid #f0397a99;white-space:nowrap}
.lkp{position:fixed;right:0;bottom:0;width:min(84vw,440px);height:min(74vh,640px);overflow:hidden;opacity:.62;pointer-events:none;-webkit-mask-image:linear-gradient(to left,#000 50%,transparent),linear-gradient(to top,#000 82%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to left,#000 50%,transparent),linear-gradient(to top,#000 82%,transparent);mask-composite:intersect;z-index:0}
.lki{position:absolute;inset:-8%;background:var(--me) center top/cover;animation:wz 14s ease-in-out infinite alternate,wf 5s ease-in-out infinite}
@keyframes wz{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.14) translate(-3%,-2%)}}
@keyframes wf{0%,100%{filter:brightness(.9) saturate(1)}8%{filter:brightness(1.5) saturate(1.2)}12%{filter:brightness(.95)}16%{filter:brightness(1.35)}22%{filter:brightness(.9)}}
.lkb{animation:bp 3s ease-in-out infinite alternate}
@keyframes bp{from{box-shadow:0 0 14px #ff7a1a66}to{box-shadow:0 0 34px #ff7a1acc}}
.lkb{width:100%;max-width:420px;margin:0 auto;border-radius:200px 200px 0 0/120px 120px 0 0;overflow:hidden;border:2px solid #ffd54a99;border-bottom:0;box-shadow:0 0 24px #ff7a1a99;position:relative;z-index:1}
.lkb img{display:block;width:100%}
.lkin{max-width:420px;border-radius:0 0 14px 14px!important;position:relative;z-index:1}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.sm{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px;min-height:74px;border-radius:14px;border:1.5px solid #53dfff88;background:linear-gradient(#1763b7cc,#08255fcc);box-shadow:0 0 10px #53dfff33,inset 0 0 8px #ffffff10}
.sm span{font-size:22px;line-height:1}
.sm b{font-size:11.5px;line-height:1.3;text-align:center;font-weight:700}
.sback{padding:6px 16px;font-size:13px;margin:0 0 10px;border-radius:14px}
.ra{grid-column:auto;align-self:center;justify-self:center;width:30px;height:46px;padding:0;font-size:16px;border-radius:10px;border:2px solid #ffd54a;background:linear-gradient(#1763b7,#08255f);box-shadow:0 0 10px #ffd54a66}
.ra:disabled{opacity:.25;box-shadow:none}
.ra.v{visibility:hidden}
.card.new{animation:flip .6s}
@keyframes flip{0%{transform:perspective(500px) rotateY(180deg) scale(.8)}60%{transform:perspective(500px) rotateY(-12deg) scale(1.1)}100%{transform:none}}
.card.zoom{animation:zoomf 2.2s;z-index:9;position:relative}
@keyframes zoomf{0%{transform:scale(1)}20%,75%{transform:scale(1.9);box-shadow:0 0 40px #fff}100%{transform:scale(1)}}
.card .bk small{font-size:.55em}
.card .bk .em{font-size:1.25em;margin-bottom:2px}
.card.peek{background:var(--b);opacity:.75;border:2px dashed #fff}
.nb{position:absolute;top:2px;right:5px;font-size:calc(var(--sz)*.2);font-style:normal;opacity:.75;color:#222}
.kb{text-align:center;font-size:22px;font-weight:800;background:#ffd400;color:#300;border-radius:12px;padding:8px;margin:6px 0;animation:pop .6s}
.card .bk img{width:55%;height:55%}
@keyframes pop{0%{transform:scale(.6) rotateY(90deg)}70%{transform:scale(1.15)}100%{transform:none}}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;padding:10px 12px;display:flex;gap:8px;background:#050518cc}
nav button{flex:1;font-size:13px}
.q{position:fixed;bottom:64px;right:12px;width:210px;background:#1b1b3df5;border-radius:14px;padding:10px;display:grid;gap:8px;box-shadow:0 0 20px #000a}
.q .pk{display:flex;gap:6px;align-items:center;justify-content:center}
/* عنوان متوهج */
.gt,.cn{display:inline-block;font-weight:800;background:linear-gradient(90deg,#fff3a0,#ffc21e,#ff7ad9,#7af0ff,#fff3a0);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gl 3.2s linear infinite,tg 1.8s ease-in-out infinite alternate}
@keyframes gl{to{background-position:250% 0}}
@keyframes tg{from{filter:drop-shadow(0 0 2px #ffc21e)}to{filter:drop-shadow(0 0 9px #ffc21e) drop-shadow(0 0 16px #ff7ad9)}}
/* اسم الصانع والرقم */
.cr{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;direction:ltr;margin:18px 0}
.cs{color:#ffd54a;text-shadow:0 0 8px #ffb300}
.cp{font-weight:800;color:#8ff5ff;letter-spacing:1px;border:1px solid #53dfff88;border-radius:12px;padding:2px 10px;background:#0a2a6a99;text-shadow:0 0 6px #19c4ff,0 0 14px #19c4ff88;pointer-events:none;user-select:none}
/* نوافذ داخل اللعبة بدل alert/prompt/confirm */
#dlg{display:none;position:fixed;inset:0;background:#000b;z-index:200;align-items:center;justify-content:center;padding:16px}
#dlg.on{display:flex}
.dbox{background:#14143a;border:2px solid #53dfff;border-radius:16px;padding:16px;width:100%;max-width:360px;text-align:center;box-shadow:0 0 30px #53dfff55;animation:pop .3s}
.dbox p{margin:0 0 12px;line-height:1.7;font-weight:800}
.dbox input{width:100%;margin-bottom:10px;text-align:center}
/* الترس الشفاف */
.hide{display:none!important}
#gear{position:fixed;left:0;top:40%;z-index:150;touch-action:none;user-select:none;-webkit-user-select:none;opacity:.22;transition:opacity .25s;line-height:0}
#gear.on{opacity:1;filter:drop-shadow(0 4px 8px #000a)}
#gbtn{background:transparent;padding:0;border-radius:50%;touch-action:none}
#gbtn svg{width:52px;height:52px;display:block}
#gmenu{position:fixed;z-index:160;width:min(190px,calc(100vw - 16px));padding:7px;background:#08245ee6;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1.5px solid #53dfff;border-radius:14px;box-shadow:0 8px 26px #000c;display:grid;gap:5px}
#gmenu button{width:100%;padding:7px 8px;font-size:13px;border-radius:16px;background:linear-gradient(#1763b7,#08255f);border:1.5px solid #4fd0ff}
#gmenu{max-height:75vh;overflow:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#gtm{text-align:center;font-weight:800;font-size:13px;padding:6px;border:1px solid #53dfff;border-radius:10px;direction:ltr}
/* توهج الصناديق ولمعة */
.card:not(.open):not(.rev){animation:cg 2.6s ease-in-out var(--dl,0s) infinite alternate}
@keyframes cg{from{box-shadow:0 4px 0 #0005,0 0 8px var(--f)}to{box-shadow:0 4px 0 #0005,0 0 24px var(--f),0 0 42px var(--f)}}
.card:not(.open):not(.rev)::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff77,transparent);transform:skewX(-20deg);animation:sh 5s ease-in-out var(--dl,0s) infinite;pointer-events:none}
@keyframes sh{0%,60%{left:-70%}100%{left:130%}}
.card .bk .em img{width:1.2em;height:1.2em;object-fit:contain}
/* خلفية متحركة خفيفة */
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#app{position:relative;z-index:1}
#bgfx .bl{position:absolute;border-radius:50%;filter:blur(50px);opacity:.28;animation:dr 14s ease-in-out infinite alternate}
.b1{width:300px;height:300px;background:var(--bl1,#ff4fd0);left:-80px;top:10%}
.b2{width:340px;height:340px;background:var(--bl2,#4fe3ff);right:-100px;top:45%;animation-duration:18s!important}
.b3{width:260px;height:260px;background:var(--bl3,#ffc21e);left:20%;bottom:-80px;animation-duration:16s!important}
@keyframes dr{to{transform:translate(60px,-80px) scale(1.2)}}
#bgfx .st{position:absolute;bottom:-20px;color:#fff;font-style:normal;opacity:0;text-shadow:0 0 8px #fff;animation:up linear infinite}
@keyframes up{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.8}100%{transform:translateY(-110vh) scale(1.1) rotate(180deg);opacity:0}}
/* زينة الاسم */
.dec{display:inline-block;filter:drop-shadow(0 0 8px #ffc21e);animation:bob 2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px) rotate(8deg) scale(1.12)}}
.sp{display:flex;justify-content:center;gap:12px;margin-top:6px;font-size:16px}
.sp i{font-style:normal;animation:tw 1.6s ease-in-out infinite alternate}
.sp i:nth-child(2n){animation-delay:.5s}.sp i:nth-child(3n){animation-delay:.9s}
@keyframes tw{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.25);filter:drop-shadow(0 0 6px #fff)}}
.gs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:-2px 0 8px}
.gc{text-align:center;padding:4px 14px;border-radius:12px;border:2px solid var(--tc);background:#ffffff14;box-shadow:0 0 14px var(--tc)}
.gc b{display:block;font-size:22px}
/* الأزرار الإضافية */
.exr{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.exb{flex:1 1 90px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:6px 8px;border-radius:14px;border:2px solid #ffd54a;background:linear-gradient(#1763b7,#08255f);box-shadow:0 3px 0 #031a45,0 0 14px #ffd54a55}
.exb img{height:30px;max-width:40px;object-fit:contain;border-radius:6px}
.exb::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:skewX(-20deg);animation:sh 4.5s ease-in-out infinite}
.exb.hit{animation:hit .35s}
@keyframes hit{50%{transform:scale(.9);box-shadow:0 0 26px #ffd54a}}
/* توهج أقوى: الاسم والرقم والأقسام */
.cr{padding:8px 16px;border-radius:18px;background:linear-gradient(#0d1f5c99,#06123a99);box-shadow:0 0 22px #ffb30044,inset 0 0 14px #ffffff10;border:1px solid #ffd54a55;width:fit-content;max-width:100%;margin:18px auto}
.cn{font-size:19px;animation:gl 3s linear infinite,tg2 1.4s ease-in-out infinite alternate}
@keyframes tg2{from{filter:drop-shadow(0 0 3px #ffc21e) drop-shadow(0 0 6px #ff7ad9)}to{filter:drop-shadow(0 0 12px #ffc21e) drop-shadow(0 0 22px #ff7ad9) drop-shadow(0 0 34px #7af0ff)}}
.cp{font-size:20px;color:#eaffff;border:2px solid #53dfff;background:#06245a;letter-spacing:2px;animation:ph 1.2s ease-in-out infinite alternate}
@keyframes ph{from{box-shadow:0 0 6px #19c4ff,0 0 14px #19c4ff88;text-shadow:0 0 6px #19c4ff,0 0 12px #19c4ff;color:#bff6ff}to{box-shadow:0 0 18px #19c4ff,0 0 38px #19c4ffaa,0 0 60px #7a3bff88;text-shadow:0 0 10px #fff,0 0 22px #19c4ff,0 0 36px #19c4ff;color:#fff}}
.cr{flex-wrap:nowrap}
@media(max-width:480px){.cr{gap:6px;padding:8px 10px}.cr>span:first-child,.cs{display:none}.cn{font-size:15px}.cp{font-size:15px;letter-spacing:1px;padding:2px 8px}}
section{border:1px solid #ffffff22;animation:sg 3.5s ease-in-out infinite alternate}
@keyframes sg{from{box-shadow:0 0 0 #53dfff00}to{box-shadow:0 0 18px #53dfff55}}
nav button{box-shadow:0 0 10px #b01cff66}
.spk{position:fixed;z-index:120;pointer-events:none;font-style:normal;font-size:18px;animation:spkf .8s ease-out forwards}
@keyframes spkf{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(200deg);opacity:0}}
/* قوس قزح + متصدر + صور الخلفية */
.board.rb .card:not(.open):not(.rev){border:max(var(--bw,0px),3px) solid #ff3b3b;animation:cg 2.6s ease-in-out var(--dl,0s) infinite alternate,rbw 5s linear var(--dl,0s) infinite}
@keyframes rbw{0%,100%{border-color:#ff3b3b}16%{border-color:#ffb300}33%{border-color:#a8ff3b}50%{border-color:#3be8ff}66%{border-color:#6b3bff}83%{border-color:#ff3be0}}
.tm.lead,.gc.lead{position:relative;border-color:#ffd54a;box-shadow:0 0 0 3px #ffd54a,0 0 26px #ffd54a,0 0 48px #ffb300;animation:ld 1.3s ease-in-out infinite alternate}
.tm.lead::before,.gc.lead::before{content:"👑";position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:22px;animation:cr2 1.3s ease-in-out infinite alternate;filter:drop-shadow(0 0 6px #ffd54a)}
.tm.lead::after,.gc.lead::after{content:"✨";position:absolute;right:-6px;top:-8px;font-size:16px;animation:tw 1s ease-in-out infinite alternate}
@keyframes ld{to{box-shadow:0 0 0 3px #fff3a0,0 0 40px #ffd54a,0 0 70px #ffb300}}
@keyframes cr2{to{transform:translateX(-50%) translateY(-4px) rotate(8deg)}}
#bgi{position:absolute;inset:0}
.bgi{position:absolute;inset:-6%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s;animation:kb 22s ease-in-out infinite alternate}
.bgi.on{opacity:.5}
@keyframes kb{to{transform:scale(1.15) translate(2%,-2%)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* ===== perf ===== */
.card{direction:rtl}
*{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.paused *,.paused *::before,.paused *::after{animation-play-state:paused!important}
.card:not(.open):not(.rev){animation:none!important;box-shadow:0 4px 0 #0005,0 0 16px var(--f)}
.card:not(.open):not(.rev)::after{display:none}
.board.rb .card:not(.open):not(.rev){animation:none!important}
section{animation:none!important;box-shadow:0 0 10px #53dfff44}
@keyframes tw{from{opacity:.4;transform:scale(.8)}to{opacity:1;transform:scale(1.2)}}
@keyframes sh{0%,60%{transform:translateX(0) skewX(-20deg)}100%{transform:translateX(500%) skewX(-20deg)}}

/* ===== v2: ثيمات + نيون + تحكم + 3D ===== */
html,body{overscroll-behavior-y:none;overscroll-behavior-x:none}
#app{padding-top:env(safe-area-inset-top,0px)}
body.carbon::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(45deg,#ffffff07 0 2px,transparent 2px 6px),repeating-linear-gradient(-45deg,#00000055 0 2px,transparent 2px 6px)}
.bwrap.bz{overflow-x:auto;overflow-y:hidden;direction:ltr;padding:30px 12px;margin:-30px -12px;-webkit-overflow-scrolling:touch}
.bwrap .board{margin:0 auto}
.bwrap.bz .board{margin:0}
.ctl{position:relative;z-index:3;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:4px 0 10px}
.zc{display:flex;gap:6px;align-items:center;background:#0006;border:1.5px solid #53dfff66;border-radius:14px;padding:4px 6px}
.zc button{padding:6px 12px;font-size:16px;border-radius:10px;background:linear-gradient(#1763b7,#08255f)}
.zc span{min-width:58px;text-align:center;font-weight:800;font-size:13px}
.om{flex:1 1 150px;padding:10px 12px;border-radius:14px;border:2px solid #53dfff;background:linear-gradient(#1763b7,#08255f);box-shadow:0 0 12px #53dfff44;font-size:14px}
.om.row{border-color:#ffd54a;background:linear-gradient(#c2410c,#7c2d12);box-shadow:0 0 16px #ffd54a99}
.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 12px}
.tt{padding:6px;border-radius:14px;background:#0007;border:2px solid #fff2;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.tt.sel{border-color:#ffd54a;box-shadow:0 0 14px #ffd54a99}
.tt b{font-size:12.5px;text-align:center}
.tp{height:74px;border-radius:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;align-content:center}
.tp i{aspect-ratio:1;display:block}
/* نيون زي الصورة: صندوق أسود بإطار متوهج ورقم أبيض */
.board.neon .card.card:not(.open):not(.rev){background:linear-gradient(160deg,#17151d,#050507);color:#fff;font-weight:900;border:max(var(--bw,0px),2px) solid var(--f);box-shadow:0 0 6px var(--f),0 0 16px var(--f);text-shadow:0 0 6px #ffffffaa,0 0 14px var(--f);animation:none!important}
.board.neon .card.card:not(.open):not(.rev){box-shadow:0 0 6px var(--f),0 0 14px color-mix(in srgb,var(--f) 65%,transparent),inset 0 0 12px color-mix(in srgb,var(--f) 22%,transparent)}
.board.neon .card.open,.board.neon .card.rev{background:linear-gradient(160deg,#17151d,var(--b));border-color:var(--tc);box-shadow:0 0 12px var(--tc),inset 0 0 14px #ffffff12;color:#fff}
.board.neon .card.open{background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 30%,var(--b)),var(--b))}
.board.neon .card .bk{color:#fff!important;text-shadow:0 0 8px var(--tc),0 0 18px var(--tc)}
.board.neon .nb{color:#fff;opacity:.7}
/* رسالة صغيرة */
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(18px);background:#0a0a2af2;border:1.5px solid #53dfff;color:#fff;padding:9px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:190;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* مفتاح 3D ثانيتين ويختفي */
#keyfx{position:fixed;inset:0;z-index:180;display:flex;align-items:center;justify-content:center;pointer-events:none;perspective:800px;animation:kfbg 2.7s ease both}
@keyframes kfbg{0%{background:#0000}15%,70%{background:radial-gradient(circle,#0000 10%,#000b 88%)}100%{background:#0000}}
.kfw{position:relative;width:min(52vw,230px);height:min(52vw,230px);transform-style:preserve-3d;animation:kfw 2.7s cubic-bezier(.3,.7,.3,1) both}
@keyframes kfw{0%{transform:translateY(140px) scale(.15) rotateX(70deg);opacity:0}16%{transform:translateY(0) scale(1.18) rotateX(0);opacity:1}24%{transform:scale(1)}72%{transform:translateY(-10px) scale(1.04);opacity:1;filter:none}100%{transform:translateY(-190px) scale(2.4) rotateX(-35deg);opacity:0;filter:blur(10px)}}
.kfs{position:absolute;inset:0;transform-style:preserve-3d;animation:kfs 2.7s cubic-bezier(.3,.6,.3,1) both}
@keyframes kfs{0%{transform:rotateY(-540deg) rotateZ(-25deg)}24%{transform:rotateY(0) rotateZ(-20deg)}72%{transform:rotateY(35deg) rotateZ(-12deg)}100%{transform:rotateY(540deg) rotateZ(10deg)}}
.kfs i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:min(40vw,190px);line-height:1}
.kfs i img{width:75%;height:75%;object-fit:contain}
.kfg{position:absolute;inset:-25%;border-radius:50%;background:radial-gradient(circle,#ffe27acc,#ffb30055 45%,transparent 70%);transform:translateZ(-30px);animation:kfgl .9s ease-in-out infinite alternate}
@keyframes kfgl{to{transform:translateZ(-30px) scale(1.25);opacity:.7}}
#gmenu{width:min(172px,calc(100vw - 16px))!important;padding:5px!important;gap:4px!important}
#gmenu button{padding:5px 3px!important;font-size:11.5px!important;border-radius:12px!important}
#gmenu .g2{gap:4px}
#gtm{font-size:12px!important;padding:4px!important}
#gear.on #gbtn svg,#gbtn svg{width:46px;height:46px}
.ctl{justify-content:center!important}
nav button.omn.row{background:linear-gradient(#c2410c,#7c2d12);box-shadow:0 0 14px #ffd54a99}

/* ===== v3: أرقام أكبر + إلغاء الوميض والحركة + أزرار أصغر + عدّادات الصفوف/الأعمدة ===== */
.fn{font-size:1.5em;font-weight:900;line-height:1}
.fn.f3{font-size:1.15em}
.pv{font-size:1.4em;font-weight:900;line-height:1}
.nb{font-size:calc(var(--sz)*.24);opacity:.85}
.ph{aspect-ratio:1;visibility:hidden;pointer-events:none}
#bgfx .st{display:none!important}
#bgfx .bl,.bgi{animation:none!important}
.tm.act,.tm.lead,.gc.lead,.go,.kfg,.lki,.lkb{animation:none!important}
.tm.lead::before,.gc.lead::before,.tm.lead::after,.gc.lead::after{animation:none!important}
.exb::after{display:none!important}
.gt{animation:gl 3.2s linear infinite!important;filter:none!important}
.cn{animation:gl 3s linear infinite!important;filter:none!important}
.cp{animation:none!important;color:#eaffff;box-shadow:0 0 10px #19c4ff88;text-shadow:0 0 6px #19c4ff}
@keyframes kfbg{from,to{background:#0000}}
@keyframes zoomf{0%{transform:scale(1)}20%,75%{transform:scale(1.9)}100%{transform:scale(1)}}
footer{grid-template-columns:1fr 1fr;gap:6px;padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px));background:#050518f5;border-top:1px solid #ffffff1a}
footer .tot{grid-column:1/-1;padding:3px 10px;font-size:12px;border-radius:999px;background:#19f5c81c;color:#19f5c8;border:1px solid #19f5c855}
footer button{padding:9px 6px;font-size:13px;border-radius:10px;box-shadow:none}
footer .go{font-size:13px;padding:9px 6px;animation:none}
footer .go:nth-child(2){grid-column:1/-1}
#app{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
nav{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.seg.stp{justify-content:space-between}
.seg.stp span{flex:1}
.seg.stp button{flex:none;width:44px;padding:8px 0;font-size:20px}
.seg.stp b{min-width:34px;text-align:center;font-size:18px}
#gridnote{display:block;margin:-2px 0 6px;opacity:.85;font-size:12px}
.q .pk b{min-width:22px;text-align:center}
.board.dark .card.card:not(.open):not(.rev){background:linear-gradient(160deg,color-mix(in srgb,var(--f) 75%,#000),color-mix(in srgb,var(--f) 22%,#000));color:#fff;font-weight:900;border:max(var(--bw,0px),2px) solid var(--bc,#fff);box-shadow:0 4px 0 #000a,inset 0 0 14px #0008;text-shadow:0 1px 2px #000a;animation:none!important}
.board.dark .card.open,.board.dark .card.rev{background:linear-gradient(160deg,#17151d,var(--b));border-color:var(--tc);box-shadow:0 0 8px var(--tc),inset 0 0 14px #ffffff12;color:#fff}
.board.dark .card.open{background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 30%,var(--b)),var(--b))}
.board.dark .card .bk{color:#fff!important;text-shadow:0 0 6px var(--tc)}
.board.dark .nb{color:#fff;opacity:.7}
.cb{display:inline-flex;align-items:center;gap:6px}
.fn{font-size:calc(1.5em*var(--ns,1))}
.fn.f3{font-size:calc(1.15em*var(--ns,1))}
.kc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.4em;font-style:normal;opacity:.8;line-height:1;pointer-events:none;z-index:0}
.card .kc img{width:88%;height:88%;object-fit:contain}
.fn{position:relative;z-index:1}
@supports (paint-order:stroke){.fn{-webkit-text-stroke:.14em var(--f);paint-order:stroke fill}}
.card{isolation:isolate}
button,.card,.exb,.tm{touch-action:manipulation}
nav{z-index:55}
.q{z-index:60;width:236px;max-height:calc(100vh - 150px);overflow:auto;gap:6px}
.q .pk{justify-content:space-between;white-space:nowrap;font-size:13px}
.q .pk button{width:34px;padding:6px 0;flex:none}
.q>button{padding:8px;font-size:13px}
/* صناديق في الصف (قائمة الترس) */
#gmenu .gcols{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:3px 5px;border-radius:12px;background:#0004;border:1px solid #4fd0ff66;font-size:11.5px;font-weight:800;color:#fff}
#gmenu .gcols span{flex:1;min-width:0;white-space:nowrap}
#gmenu .gcols button{width:28px!important;flex:none;padding:3px 0!important;font-size:15px!important;line-height:1}
#gmenu .gcols b{min-width:18px;text-align:center;color:#ffd54a;font-size:14px}
</style>
</head>

    case'score':{const v=await ask('عدّل نقاط '+S.teams[i].n,G.scores[i]);if(v!==null&&v.trim()!==''&&!isNaN(+v))G.scores[i]=+v;game();return}
  }
  save();redo();
});
/* رفع الصور (تتصغّر تلقائياً عشان التخزين) */
fi.onchange=()=>{
  const f=fi.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,(fi.dataset.t=='bgi'?900:200)/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const t=fi.dataset.t,d=c.toDataURL(t=='bgi'?'image/jpeg':'image/png',.72);
    if(t=='bgi')S.bgImgs=(S.bgImgs||[]).concat(d).slice(-3);else if(t=='key')S.keyImg=d;else if(t=='inner')S.innerImg=d;else if(String(t)[0]=='x')S.extras[+String(t).slice(1)].img=d;else S.types[t].img=d;
    save();fi.value='';redo();
  };im.src=r.result};
  r.readAsDataURL(f);
};
fa.onchange=()=>{
  const f=fa.files[0];if(!f)return;
  if(f.size>1500000){say('الملف كبير (أكتر من 1.5 ميجا). اختار صوت أقصر.');fa.value='';return}
  const r=new FileReader();
  r.onload=()=>{const t=fa.dataset.t;if(t=='music')S.musicSrc=r.result;else if(t=='ksnd')S.keySnd=r.result;else if(String(t).slice(0,2)=='xs')S.extras[+String(t).slice(2)].snd=r.result;else S.types[t].snd=r.result;save();fa.value='';redo()};
  r.readAsDataURL(f);
};
/* ---- سحب الترس لأي مكان ---- */
const gear=$('#gear'),gbtn=$('#gbtn'),gmenu=$('#gmenu');
function placeMenu(){if(gmenu.classList.contains('hide'))return;const r=gear.getBoundingClientRect(),w=gmenu.offsetWidth,h=gmenu.offsetHeight;let x=r.left,y=r.bottom+6;if(x+w>innerWidth-6)x=innerWidth-w-6;if(x<6)x=6;if(y+h>innerHeight-6)y=Math.max(6,r.top-h-6);gmenu.style.left=x+'px';gmenu.style.top=y+'px'}
(function(){
  const K='bx_gear_pos',clamp=(x,y)=>[Math.max(0,Math.min(innerWidth-(gear.offsetWidth||52),x)),Math.max(0,Math.min(innerHeight-(gear.offsetHeight||52),y))];
  const setPos=(x,y)=>{[x,y]=clamp(x,y);gear.style.left=x+'px';gear.style.top=y+'px'};
  try{const q=JSON.parse(LS.getItem(K)||'null');if(q)setPos(q.x,q.y)}catch(e){}
  let sx,sy,ox,oy,drag=false,down=false;
  gbtn.addEventListener('pointerdown',e=>{down=true;drag=false;sx=e.clientX;sy=e.clientY;const r=gear.getBoundingClientRect();ox=r.left;oy=r.top;try{gbtn.setPointerCapture(e.pointerId)}catch(_){}});
  gbtn.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!drag&&Math.hypot(dx,dy)<7)return;drag=true;setPos(ox+dx,oy+dy);placeMenu()});
  const end=()=>{if(!down)return;down=false;if(drag){const r=gear.getBoundingClientRect();try{LS.setItem(K,JSON.stringify({x:r.left,y:r.top}))}catch(e){}}};
  gbtn.addEventListener('pointerup',end);gbtn.addEventListener('pointercancel',end);
  gbtn.addEventListener('click',e=>{if(drag){drag=false;return}gmenu.classList.toggle('hide');gear.classList.toggle('on',!gmenu.classList.contains('hide'));updGcv();updTimer();placeMenu()});
  addEventListener('resize',()=>{const r=gear.getBoundingClientRect();setPos(r.left,r.top);placeMenu()});
})();
setInterval(()=>{tickClock();updTimer();if(view!='lock'&&!actValid()){lock();lockMsg('انتهت مدة التفعيل. أدخل كود تفعيل جديد للمتابعة.')}},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickClock();updTimer()}});
/* تم إلغاء الرموز المتحركة في الخلفية */
/* ===== v2: ملء الشاشة تلقائي، منع السحب للتحديث، حفظ تلقائي، حماية الرجوع، مفتاح 3D ===== */
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400)}
function keyIntro(kind){
  const old=$('#keyfx');if(old)old.remove();
  const f=kind=='inner'?(S.innerImg?`<img src="${S.innerImg}" alt="">`:esc(S.innerIcon||'🔑')):(S.keyImg?`<img src="${S.keyImg}" alt="">`:esc(S.keyIcon||'🔑'));
  const L=Array.from({length:9},(_,k)=>`<i style="transform:translateZ(${(4-k)*3}px);filter:brightness(${k?Math.max(.35,1-k*.08):1.12})">${f}</i>`).join('');
  const d=document.createElement('div');d.id='keyfx';d.innerHTML=`<div class=kfw><div class=kfg></div><div class=kfs>${L}</div></div>`;
  document.body.appendChild(d);
  if(S.sfx)[880,1175,1568].forEach((q,k)=>setTimeout(()=>beep(q,.25,'sine',.08),k*120));
  setTimeout(()=>d.remove(),2800);
}
const isFS=()=>document.fullscreenElement||document.webkitFullscreenElement;
function enterFS(){if(isFS())return;const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f)return;try{const p=f.call(el);if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function exitFS(){const d=document,f=d.exitFullscreen||d.webkitExitFullscreen;if(!f)return;try{const p=f.call(d);if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function toggleFS(){isFS()?exitFS():enterFS()}
enterFS(); /* محاولة مباشرة عند الفتح (المتصفح غالبًا بيطلب لمسة واحدة) */
(()=>{let done=false;const evs=['pointerup','touchend','click','keydown'];const go=()=>{if(done)return;done=true;enterFS();evs.forEach(ev=>removeEventListener(ev,go,true))};evs.forEach(ev=>addEventListener(ev,go,{capture:true,passive:true}))})();
const refit=()=>{setTimeout(()=>{if(view=='game')autoFit()},120)};
document.addEventListener('fullscreenchange',refit);document.addEventListener('webkitfullscreenchange',refit);addEventListener('resize',refit);addEventListener('orientationchange',refit);
/* منع السحب لأسفل من تحديث الصفحة */
(()=>{let y0=0;
  addEventListener('touchstart',e=>{y0=e.touches[0].clientY},{passive:true});
  addEventListener('touchmove',e=>{
    if(e.touches.length>1)return;
    if(e.touches[0].clientY-y0<=0)return;
    if((document.scrollingElement||document.documentElement).scrollTop>0)return;
    let n=e.target;
    while(n&&n!==document.body&&n!==document.documentElement){
      if(n.nodeType===1){const oy=getComputedStyle(n).overflowY;if((oy=='auto'||oy=='scroll')&&n.scrollHeight>n.clientHeight){if(n.scrollTop>0)return;break}}
      n=n.parentNode}
    if((document.scrollingElement||document.documentElement).scrollTop<=0&&e.cancelable)e.preventDefault();
  },{passive:false});
})();
/* حفظ تلقائي عند الخروج أو تصغير التطبيق */
function persist(){try{save()}catch(e){}try{if(G)saveGame()}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});
addEventListener('pagehide',persist);
/* حماية زر الرجوع: لازم ضغطتين سريعتين عشان تخرج */
(()=>{try{history.replaceState({bx:1},'');history.pushState({bx:2},'')}catch(e){return}
  let last=0;
  addEventListener('popstate',()=>{const n=Date.now();if(n-last<1800){history.back();return}last=n;try{history.pushState({bx:2},'')}catch(e){}toast('🛡️ اللعبة محفوظة تلقائيًا — اضغط رجوع مرتين بسرعة للخروج')});
})();
bgApply();
curApply();
bgImgsRender();applyZoom();
tickClock();
if(actValid())openApp();else lock();
